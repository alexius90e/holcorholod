<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/lid-forma-footer.css" />
  </head>

  <body>
    <section class="lid-forma-footer">
      <div class="container">
        <div class="lid-forma-footer__wrapper">
          <figure class="lid-forma-footer__photo">
            <img
              class="lid-forma-footer__photo-image"
              src="./assets/lid-forma-footer/lid-forma-footer-photo.jpg"
              alt="photo"
            />
          </figure>

          <div class="lid-forma-footer__callback">
            <div class="lid-forma-footer__callback-title">Оставьте заявку</div>

            <div class="lid-forma-footer__callback-description">
              Защитите свой урожай прямо сейчас – выбирайте профессиональное технологическое
              сопровождение!
            </div>

            <form class="lid-forma-footer__callback-form">
              <input
                class="lid-forma-footer__callback-form-name"
                type="text"
                name="name"
                placeholder="Ваше имя"
                autocomplete="true"
                required
              />

              <input
                class="lid-forma-footer__callback-form-phone"
                type="tel"
                name="phone"
                placeholder="Номер телефона"
                autocomplete="true"
                required
              />

              <textarea
                class="lid-forma-footer__callback-form-message"
                placeholder="Опишите ваш проект или задачу"
              ></textarea>

              <button class="lid-forma-footer__callback-form-button">ПОЛУЧИТЬ КОНСУЛЬТАЦИЮ</button>
            </form>

            <div class="lid-forma-footer__callback-disclaimer">
              Заполняя эту форму, вы соглашаетесь с <a href="#">политикой конфиденциальности</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
